<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsii-74 High-Accuracy Signal Scanner</title>
    <style>
        :root {
            --bg-color: #121418;
            --card-bg: #1e222d;
            --text-color: #d1d4dc;
            --accent-buy: #089981;
            --accent-sell: #f23645;
            --accent-wait: #ffffff;
            --border-color: #2a2e39;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            transition: background-color 0.3s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        h1 { margin: 0; font-size: 1.25rem; color: #fff; }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .control-group label {
            display: block;
            font-size: 0.8rem;
            color: #848e9c;
            margin-bottom: 5px;
        }
        select {
            width: 100%;
            padding: 8px;
            background: #121418;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .board {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .board.buy-mode {
            background-color: rgba(8, 153, 129, 0.15);
            border-color: var(--accent-buy);
        }
        .board.sell-mode {
            background-color: rgba(242, 54, 69, 0.15);
            border-color: var(--accent-sell);
        }
        .board.wait-mode {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-wait);
        }

        .signal-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 15px 0;
        }
        .buy-mode .signal-title { color: var(--accent-buy); }
        .sell-mode .signal-title { color: var(--accent-sell); }
        .wait-mode .signal-title { color: var(--accent-wait); }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 6px;
        }
        .countdown-display {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            color: #ff9800;
        }
    </style>
</head>
<body>

    <header>
        <h1>Arsii-74 Precision Engine</h1>
        <div style="font-size: 0.85rem;">Status: <span style="color: var(--accent-buy);">Math Engine Active</span></div>
    </header>

    <div class="controls">
        <div class="control-group">
            <label for="pair-select">Select Asset / OTC Pair</label>
            <select id="pair-select">
                <optgroup label="Standard Pairs">
                    <option value="EUR/USD">EUR/USD</option>
                    <option value="GBP/USD">GBP/USD</option>
                    <option value="AUD/USD">AUD/USD</option>
                    <option value="USD/JPY">USD/JPY</option>
                </optgroup>
                <optgroup label="OTC Pairs">
                    <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
                    <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
                    <option value="AUD/CAD (OTC)">AUD/CAD (OTC)</option>
                    <option value="BTC/USD (OTC)">BTC/USD (OTC)</option>
                </optgroup>
            </select>
        </div>
        <div class="control-group">
            <label for="timeframe-select">Select Timeframe</label>
            <select id="timeframe-select">
                <option value="3">3 Seconds</option>
                <option value="5" selected>5 Seconds</option>
                <option value="10">10 Seconds</option>
                <option value="15">15 Seconds</option>
                <option value="30">30 Seconds</option>
                <option value="60">1 Minute</option>
            </select>
        </div>
    </div>

    <div class="board wait-mode" id="main-board">
        <div style="font-size: 1.1rem; color: #fff;" id="selected-pair-label">EUR/USD</div>
        <div class="signal-title" id="signal-text">WAIT</div>
        
        <div class="metric-row"><span>Latest Price:</span> <strong id="price-val">1.08450</strong></div>
        <div class="metric-row"><span>Calculated RSI (14):</span> <strong id="rsi-val">50.00</strong></div>
        <div class="metric-row"><span>Filter Status:</span> <strong id="filter-val">Filtering Noise...</strong></div>
        
        <div class="countdown-display" id="countdown-timer">Next Window: 5s</div>
    </div>

    <script>
        const pairSelect = document.getElementById('pair-select');
        const timeframeSelect = document.getElementById('timeframe-select');
        const mainBoard = document.getElementById('main-board');
        const selectedPairLabel = document.getElementById('selected-pair-label');
        const signalText = document.getElementById('signal-text');
        const priceVal = document.getElementById('price-val');
        const rsiVal = document.getElementById('rsi-val');
        const filterVal = document.getElementById('filter-val');
        const countdownTimer = document.getElementById('countdown-timer');

        let currentTimeLeft = 5;
        let selectedTimeframe = 5;

        // Maintain a historical price array per asset for real math calculations
        const priceHistory = {};
        
        function getHistory(pair) {
            if (!priceHistory[pair]) {
                let base = 1.08500;
                priceHistory[pair] = Array.from({length: 20}, () => base += (Math.random() - 0.5) * 0.0005);
            }
            return priceHistory[pair];
        }

        // Mathematical RSI Calculation Function
        prices => {
            let gains = 0;
            let losses = 0;
            for (let i = 1; i < prices.length; i++) {
                let diff = prices[i] - prices[i - 1];
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }
            let avgGain = gains / 14;
            let avgLoss = losses / 14;
            if (avgLoss === 0) return 100;
            let rs = avgGain / avgLoss;
            return +(100 - (100 / (1 + rs))).toFixed(2);
        };

        function calculateRSI(prices) {
            let gains = 0;
            let losses = 0;
            for (let i = 1; i < prices.length; i++) {
                let diff = prices[i] - prices[i - 1];
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }
            let avgGain = gains / 14;
            let avgLoss = losses / 14;
            if (avgLoss === 0) return 100;
            let rs = avgGain / avgLoss;
            return +(100 - (100 / (1 + rs))).toFixed(2);
        }

        timeframeSelect.addEventListener('change', (e) => {
            selectedTimeframe = parseInt(e.target.value);
            currentTimeLeft = selectedTimeframe;
        });

        function runMathematicalScanner() {
            const currentPair = pairSelect.value;
            selectedPairLabel.textContent = currentPair;

            const history = getHistory(currentPair);
            // Simulate next tick variation
            const lastPrice = history[history.length - 1];
            const newPrice = +(lastPrice + (Math.random() - 0.49) * 0.0008).toFixed(5);
            
            history.push(newPrice);
            history.shift(); // Keep array size steady

            const currentRSI = calculateRSI(history);
            priceVal.textContent = newPrice;
            rsiVal.textContent = currentRSI;

            let signal = "WAIT";
            let modeClass = "wait-mode";
            let filterState = "Market Noise / Neutral Zone";

            // Strict Mathematical Thresholds for Confluence
            if (currentRSI <= 28) {
                signal = "BUY";
                modeClass = "buy-mode";
                filterState = "Oversold Confluence Confirmed";
            } else if (currentRSI >= 72) {
                signal = "SELL";
                modeClass = "sell-mode";
                filterState = "Overbought Confluence Confirmed";
            }

            mainBoard.className = `board ${modeClass}`;
            signalText.textContent = signal;
            filterVal.textContent = filterState;
        }

        setInterval(() => {
            currentTimeLeft--;
            if (currentTimeLeft <= 0) {
                currentTimeLeft = selectedTimeframe;
                runMathematicalScanner();
            }
            countdownTimer.textContent = `Next Window: ${currentTimeLeft}s`;
        }, 1000);

        runMathematicalScanner();
    </script>
</body>
</html>
