<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Signal Scanner Dashboard</title>
    <style>
        :root {
            --bg-color: #121418;
            --card-bg: #1e222d;
            --text-color: #d1d4dc;
            --accent-buy: #089981;
            --accent-sell: #f23645;
            --accent-warning: #ff9800;
            --border-color: #2a2e39;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.5rem; color: #fff; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }
        .pair-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.9rem;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .badge.buy { background-color: rgba(8, 153, 129, 0.2); color: var(--accent-buy); }
        .badge.sell { background-color: rgba(242, 54, 69, 0.2); color: var(--accent-sell); }
        .badge.neutral { background-color: rgba(255, 152, 0, 0.2); color: var(--accent-warning); }
        .timer {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #848e9c;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Arsii Signal Engine Dashboard</h1>
        <div>Status: <span id="connection-status" style="color: var(--accent-sell);">Disconnected</span></div>
    </header>

    <div class="grid" id="dashboard-grid">
        <!-- Cards will be dynamically injected here -->
    </div>

    <script>
        const grid = document.getElementById('dashboard-grid');
        const statusSpan = document.getElementById('connection-status');

        function connectWebSocket() {
            // Change URL to match your backend server endpoint
            const ws = new WebSocket('ws://localhost:8000/ws/signals');

            ws.onopen = () => {
                statusSpan.textContent = 'Connected';
                statusSpan.style.color = 'var(--accent-buy)';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                grid.innerHTML = '';

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    let badgeClass = 'neutral';
                    if (item.signal === 'BUY') badgeClass = 'buy';
                    if (item.signal === 'SELL') badgeClass = 'sell';

                    card.innerHTML = `
                        <div class="pair-title">
                            <span>${item.pair}</span>
                            <span class="badge ${badgeClass}">${item.signal}</span>
                        </div>
                        <div class="metric"><span>Price:</span> <strong>${item.price}</strong></div>
                        <div class="metric"><span>RSI (14):</span> <strong>${item.rsi}</strong></div>
                        <div class="metric"><span>Trend:</span> <strong>${item.trend}</strong></div>
                        <div class="timer">Signal Window: <strong>${item.countdown}s sync</strong></div>
                    `;
                    grid.appendChild(card);
                });
            };

            ws.onclose = () => {
                statusSpan.textContent = 'Reconnecting...';
                statusSpan.style.color = 'var(--accent-warning)';
                setTimeout(connectWebSocket, 3000);
            };
        }

        connectWebSocket();
    </script>
</body>
</html>
