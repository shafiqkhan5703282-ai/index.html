<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsii-74 Signal Scanner Dashboard</title>
    <style>
        :root {
            --bg-color: #121418;
            --card-bg: #1e222d;
            --text-color: #d1d4dc;
            --accent-buy: #089981;
            --accent-sell: #f23645;
            --accent-warning: #ff9800;
            --border-color: #2a2e39;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        h1 { margin: 0; font-size: 1.25rem; color: #fff; }
        .status-box { font-size: 0.85rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            position: relative;
        }
        .pair-title {
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 0.85rem;
        }
        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .badge.buy { background-color: rgba(8, 153, 129, 0.2); color: var(--accent-buy); }
        .badge.sell { background-color: rgba(242, 54, 69, 0.2); color: var(--accent-sell); }
        .badge.neutral { background-color: rgba(255, 152, 0, 0.2); color: var(--accent-warning); }
        .timer {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #848e9c;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Arsii-74 Dashboard</h1>
        <div class="status-box">Status: <span id="connection-status" style="color: var(--accent-buy);">Active (15s)</span></div>
    </header>

    <div class="grid" id="dashboard-grid">
        <!-- Dynamic Cards Injection -->
    </div>

    <script>
        const grid = document.getElementById('dashboard-grid');
        
        // Comprehensive list including standard and OTC market pairs
        const PAIRS = [
            "EUR/USD", "GBP/USD", "AUD/USD", "USD/JPY", 
            "EUR/GBP", "USD/CAD", "EUR/USD (OTC)", "GBP/USD (OTC)", 
            "AUD/CAD (OTC)", "NZD/USD (OTC)", "BTC/USD (OTC)", "ETH/USD (OTC)"
        ];

        function updateDashboard() {
            grid.innerHTML = '';

            PAIRS.forEach(pair => {
                const base_price = (Math.random() * (1.15 - 1.0) + 1.0).toFixed(5);
                const rsi = (Math.random() * (85 - 15) + 15).toFixed(2);
                const trend = rsi > 50 ? "BULLISH" : "BEARISH";
                
                // Logic framework for signal triggers
                let signal = "NEUTRAL";
                if (rsi < 32) signal = "BUY";
                else if (rsi > 68) signal = "SELL";

                let badgeClass = 'neutral';
                if (signal === 'BUY') badgeClass = 'buy';
                if (signal === 'SELL') badgeClass = 'sell';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="pair-title">
                        <span>${pair}</span>
                        <span class="badge ${badgeClass}">${signal}</span>
                    </div>
                    <div class="metric"><span>Price:</span> <strong>${base_price}</strong></div>
                    <div class="metric"><span>RSI Indicator:</span> <strong>${rsi}</strong></div>
                    <div class="metric"><span>Market Trend:</span> <strong>${trend}</strong></div>
                    <div class="timer">Timeframe Window: <strong>15s Sync</strong></div>
                `;
                grid.appendChild(card);
            });
        }

        // Refresh stream loop every 1 second
        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
