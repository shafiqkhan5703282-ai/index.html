<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsii-74 Manual Trigger Terminal</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #151922;
            --text-color: #eaecef;
            --accent-buy: #0ecb81;
            --accent-sell: #f6465d;
            --accent-wait: #ffffff;
            --border-color: #2b313a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
        }
        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.6rem; color: #fff; letter-spacing: 0.5px; }
        
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .control-group label {
            display: block;
            font-size: 0.85rem;
            color: #848e9c;
            margin-bottom: 6px;
            font-weight: 600;
        }
        select {
            width: 100%;
            padding: 10px;
            background: #0b0e11;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Big Action Button */
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #f0b90b, #d49a00);
            color: #0b0e11;
            font-size: 1.2rem;
            font-weight: 900;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(240, 185, 11, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(240, 185, 11, 0.5);
        }
        .action-btn:disabled {
            background: #2b313a;
            color: #848e9c;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Big Dynamic Professional Board */
        .terminal-board {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .terminal-board.buy-mode {
            background-color: rgba(14, 203, 129, 0.12);
            border-color: var(--accent-buy);
            box-shadow: 0 0 30px rgba(14, 203, 129, 0.25);
        }
        .terminal-board.sell-mode {
            background-color: rgba(246, 70, 93, 0.12);
            border-color: var(--accent-sell);
            box-shadow: 0 0 30px rgba(246, 70, 93, 0.25);
        }
        .terminal-board.wait-mode {
            background-color: rgba(255, 255, 255, 0.03);
            border-color: var(--border-color);
        }

        .pair-badge {
            font-size: 1.2rem;
            color: #848e9c;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .signal-display {
            font-size: 3.2rem;
            font-weight: 900;
            margin: 15px 0;
            letter-spacing: 2px;
        }
        .buy-mode .signal-display { color: var(--accent-buy); }
        .sell-mode .signal-display { color: var(--accent-sell); }
        .wait-mode .signal-display { color: var(--accent-wait); }

        .metrics-grid {
            margin: 20px 0;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 1.05rem;
        }
        .metric-row span { color: #848e9c; }
        .metric-row strong { color: #fff; }

        .countdown-container {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .countdown-label {
            font-size: 0.9rem;
            color: #848e9c;
            margin-bottom: 5px;
        }
        .countdown-number {
            font-size: 2rem;
            font-weight: bold;
            color: #f0b90b;
        }
        .countdown-number.urgent {
            color: var(--accent-sell);
            animation: pulse 0.6s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.6; transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Arsii-74 Professional Terminal</h1>
        </header>

        <!-- Controls: All Pairs & Timeframes -->
        <div class="control-panel">
            <div class="control-group">
                <label for="pair-select">Asset / Pair Selection</label>
                <select id="pair-select">
                    <optgroup label="Standard Forex Pairs">
                        <option value="EUR/USD">EUR/USD</option>
                        <option value="GBP/USD">GBP/USD</option>
                        <option value="AUD/USD">AUD/USD</option>
                        <option value="USD/JPY">USD/JPY</option>
                        <option value="USD/CAD">USD/CAD</option>
                        <option value="EUR/GBP">EUR/GBP</option>
                    </optgroup>
                    <optgroup label="OTC Forex Pairs">
                        <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
                        <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
                        <option value="AUD/USD (OTC)">AUD/USD (OTC)</option>
                        <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
                        <option value="USD/CHF (OTC)">USD/CHF (OTC)</option>
                        <option value="EUR/GBP (OTC)">EUR/GBP (OTC)</option>
                        <option value="EUR/JPY (OTC)">EUR/JPY (OTC)</option>
                        <option value="GBP/JPY (OTC)">GBP/JPY (OTC)</option>
                        <option value="AUD/CAD (OTC)">AUD/CAD (OTC)</option>
                        <option value="NZD/USD (OTC)">NZD/USD (OTC)</option>
                        <option value="USD/CAD (OTC)">USD/CAD (OTC)</option>
                    </optgroup>
                    <optgroup label="OTC Crypto & Commodities">
                        <option value="BTC/USD (OTC)">BTC/USD (OTC)</option>
                        <option value="ETH/USD (OTC)">ETH/USD (OTC)</option>
                        <option value="LTC/USD (OTC)">LTC/USD (OTC)</option>
                        <option value="XRP/USD (OTC)">XRP/USD (OTC)</option>
                        <option value="Gold (OTC)">Gold (OTC)</option>
                        <option value="Silver (OTC)">Silver (OTC)</option>
                    </optgroup>
                </select>
            </div>
            <div class="control-group">
                <label for="timeframe-select">Trade Duration</label>
                <select id="timeframe-select">
                    <optgroup label="Short Seconds">
                        <option value="3">3 Seconds</option>
                        <option value="5" selected>5 Seconds</option>
                        <option value="10">10 Seconds</option>
                        <option value="15">15 Seconds</option>
                        <option value="30">30 Seconds</option>
                        <option value="45">45 Seconds</option>
                    </optgroup>
                    <optgroup label="Minutes & Hours">
                        <option value="60">1 Minute</option>
                        <option value="300">5 Minutes</option>
                        <option value="900">15 Minutes</option>
                        <option value="3600">1 Hour</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <!-- Big Manual Trigger Button -->
        <button class="action-btn" id="trigger-btn">Generate Next Signal</button>

        <!-- Big Dynamic Terminal Board -->
        <div class="terminal-board wait-mode" id="terminal-board">
            <div class="pair-badge" id="display-pair">EUR/USD</div>
            <div class="signal-display" id="signal-text">WAIT</div>
            
            <div class="metrics-grid">
                <div class="metric-row"><span>Simulated Price:</span> <strong id="price-val">1.08500</strong></div>
                <div class="metric-row"><span>RSI Momentum (14):</span> <strong id="rsi-val">50.00</strong></div>
                <div class="metric-row"><span>Status:</span> <strong id="status-val">Ready for Manual Tap</strong></div>
            </div>

            <div class="countdown-container">
                <div class="countdown-label" id="countdown-title">Status</div>
                <div class="countdown-number" id="countdown-val">Idle</div>
            </div>
        </div>
    </div>

    <script>
        const pairSelect = document.getElementById('pair-select');
        const timeframeSelect = document.getElementById('timeframe-select');
        const triggerBtn = document.getElementById('trigger-btn');
        const terminalBoard = document.getElementById('terminal-board');
        const displayPair = document.getElementById('display-pair');
        const signalText = document.getElementById('signal-text');
        const priceVal = document.getElementById('price-val');
        const rsiVal = document.getElementById('rsi-val');
        const statusVal = document.getElementById('status-val');
        const countdownVal = document.getElementById('countdown-val');
        const countdownTitle = document.getElementById('countdown-title');

        const priceHistory = {};

        function getHistory(pair) {
            if (!priceHistory[pair]) {
                let base = pair.includes("BTC") ? 65000.0 : (pair.includes("Gold") ? 2300.0 : 1.08500);
                priceHistory[pair] = Array.from({length: 20}, () => base += (Math.random() - 0.5) * (base * 0.0001));
            }
            return priceHistory[pair];
        }

        function calculateRSI(prices) {
            let gains = 0;
            let losses = 0;
            for (let i = 1; i < prices.length; i++) {
                let diff = prices[i] - prices[i - 1];
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }
            let avgGain = gains / 14;
            let avgLoss = losses / 14;
            if (avgLoss === 0) return 100;
            let rs = avgGain / avgLoss;
            return +(100 - (100 / (1 + rs))).toFixed(2);
        }

        triggerBtn.addEventListener('click', () => {
            triggerBtn.disabled = true;
            let count = 5;
            displayPair.textContent = pairSelect.value;
            
            // Reset board to waiting state during countdown
            terminalBoard.className = "terminal-board wait-mode";
            signalText.textContent = "WAIT";
            statusVal.textContent = "Counting down entry...";
            countdownTitle.textContent = "Entry Countdown";
            countdownVal.classList.add('urgent');
            countdownVal.textContent = count + "s";

            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownVal.textContent = count + "s";
                } else {
                    clearInterval(countdownInterval);
                    countdownVal.classList.remove('urgent');
                    
                    // Generate Signal after countdown hits 1s
                    generateSignalResult();
                }
            }, 1000);
        });

        function generateSignalResult() {
            const currentPair = pairSelect.value;
            const history = getHistory(currentPair);
            const lastPrice = history[history.length - 1];
            const multiplier = currentPair.includes("BTC") ? 10.0 : (currentPair.includes("Gold") ? 1.0 : 0.0008);
            const newPrice = +(lastPrice + (Math.random() - 0.49) * multiplier).toFixed(currentPair.includes("BTC") ? 2 : 5);
            
            history.push(newPrice);
            history.shift();

            const rsi = calculateRSI(history);
            priceVal.textContent = newPrice;
            rsiVal.textContent = rsi;

            let signal = "WAIT";
            let modeClass = "wait-mode";
            let statusText = "Neutral / No Strong Confluence";

            if (rsi <= 26) {
                signal = "BUY";
                modeClass = "buy-mode";
                statusText = "Oversold Confluence Confirmed";
            } else if (rsi >= 74) {
                signal = "SELL";
                modeClass = "sell-mode";
                statusText = "Overbought Rejection Confirmed";
            }

            terminalBoard.className = `terminal-board ${modeClass}`;
            signalText.textContent = signal;
            statusVal.textContent = statusText;

            // Now start the trade duration countdown timer
            let tradeDuration = parseInt(timeframeSelect.value);
            countdownTitle.textContent = "Trade Active (Duration Left)";
            countdownVal.textContent = tradeDuration + "s";

            const tradeInterval = setInterval(() => {
                tradeDuration--;
                if (tradeDuration > 0) {
                    countdownVal.textContent = tradeDuration + "s";
                } else {
                    clearInterval(tradeInterval);
                    countdownTitle.textContent = "Status";
                    countdownVal.textContent = "Trade Finished. Tap Button.";
                    triggerBtn.disabled = false; // Re-enable button for next manual tap
                }
            }, 1000);
        }
    </script>
</body>
</html>
