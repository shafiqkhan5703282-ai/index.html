<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Signal Scanner Bot</title>
    <style>
        body {
            background-color: #2c221e; /* Light brown board theme */
            color: #f4f4f4;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #3b2f2d;
            border-radius: 8px;
            padding: 20px;
            max-width: 400px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .signal-box {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .call { background-color: #2e7d32; color: white; }
        .put { background-color: #c62828; color: white; }
        .neutral { background-color: #555; color: white; }
        
        button {
            background-color: #ff8c00; /* Light orange button */
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #e07b00; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Live Signal Scanner</h2>
        <div id="pair-display">Asset: EUR/USD | Timeframe: 1M</div>
        
        <div id="signal-state" class="signal-box neutral">WAITING...</div>
        
        <p>Price: <span id="price-val">--</span></p>
        <p>RSI (14): <span id="rsi-val">--</span></p>
        
        <button onclick="toggleAudio()">Toggle Sound Alert</button>
    </div>

    <script>
        let audioEnabled = false;
        const ws = new WebSocket("ws://localhost:8000/ws/signals");

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            document.getElementById("price-val").innerText = data.price;
            document.getElementById("rsi-val").innerText = data.rsi;
            
            const signalBox = document.getElementById("signal-state");
            signalBox.innerText = data.signal;
            
            signalBox.className = "signal-box";
            if (data.signal.includes("CALL")) {
                signalBox.classList.add("call");
                if (audioEnabled) playBeep();
            } else if (data.signal.includes("PUT")) {
                signalBox.classList.add("put");
                if (audioEnabled) playBeep();
            } else {
                signalBox.classList.add("neutral");
            }
        };

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            alert("Audio Alerts: " + (audioEnabled ? "ON" : "OFF"));
        }

        function playBeep() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.value = 587.33; // D5 note
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        }
    </script>
</body>
</html>
