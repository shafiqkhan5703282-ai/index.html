<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsii-74 Professional Signal Scanner</title>
    <style>
        :root {
            --bg-color: #121418;
            --card-bg: #1e222d;
            --text-color: #d1d4dc;
            --accent-buy: #089981;
            --accent-sell: #f23645;
            --accent-wait: #ffffff;
            --border-color: #2a2e39;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            transition: background-color 0.3s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        h1 { margin: 0; font-size: 1.25rem; color: #fff; }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .control-group label {
            display: block;
            font-size: 0.8rem;
            color: #848e9c;
            margin-bottom: 5px;
        }
        select {
            width: 100%;
            padding: 8px;
            background: #121418;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        /* Dynamic Board Themes based on signal */
        .board {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .board.buy-mode {
            background-color: rgba(8, 153, 129, 0.15);
            border-color: var(--accent-buy);
        }
        .board.sell-mode {
            background-color: rgba(242, 54, 69, 0.15);
            border-color: var(--accent-sell);
        }
        .board.wait-mode {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-wait);
        }

        .signal-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 15px 0;
        }
        .buy-mode .signal-title { color: var(--accent-buy); }
        .sell-mode .signal-title { color: var(--accent-sell); }
        .wait-mode .signal-title { color: var(--accent-wait); }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 6px;
        }
        .countdown-display {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            color: #ff9800;
        }
    </style>
</head>
<body>

    <header>
        <h1>Arsii-74 Signal Dashboard</h1>
        <div style="font-size: 0.85rem;">Status: <span style="color: var(--accent-buy);">Live Scanner</span></div>
    </header>

    <!-- Controls for Selection -->
    <div class="controls">
        <div class="control-group">
            <label for="pair-select">Select Asset / OTC Pair</label>
            <select id="pair-select">
                <optgroup label="Standard Pairs">
                    <option value="EUR/USD">EUR/USD</option>
                    <option value="GBP/USD">GBP/USD</option>
                    <option value="AUD/USD">AUD/USD</option>
                    <option value="USD/JPY">USD/JPY</option>
                </optgroup>
                <optgroup label="OTC Pairs">
                    <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
                    <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
                    <option value="AUD/CAD (OTC)">AUD/CAD (OTC)</option>
                    <option value="BTC/USD (OTC)">BTC/USD (OTC)</option>
                </optgroup>
            </select>
        </div>
        <div class="control-group">
            <label for="timeframe-select">Select Timeframe</label>
            <select id="timeframe-select">
                <optgroup label="Seconds">
                    <option value="3">3 Seconds</option>
                    <option value="5" selected>5 Seconds</option>
                    <option value="10">10 Seconds</option>
                    <option value="15">15 Seconds</option>
                    <option value="30">30 Seconds</option>
                </optgroup>
                <optgroup label="Minutes & Hours">
                    <option value="60">1 Minute</option>
                    <option value="300">5 Minutes</option>
                    <option value="900">15 Minutes</option>
                    <option value="3600">1 Hour</option>
                </optgroup>
            </select>
        </div>
    </div>

    <!-- Dynamic Output Board -->
    <div class="board wait-mode" id="main-board">
        <div style="font-size: 1.1rem; color: #fff;" id="selected-pair-label">EUR/USD</div>
        <div class="signal-title" id="signal-text">WAIT</div>
        
        <div class="metric-row"><span>Current Price:</span> <strong id="price-val">1.08450</strong></div>
        <div class="metric-row"><span>Indicator State:</span> <strong id="indicator-val">Analyzing...</strong></div>
        <div class="metric-row"><span>Strength Check:</span> <strong id="strength-val">Low Momentum</strong></div>
        
        <div class="countdown-display" id="countdown-timer">Next Window: 5s</div>
    </div>

    <script>
        const pairSelect = document.getElementById('pair-select');
        const timeframeSelect = document.getElementById('timeframe-select');
        const mainBoard = document.getElementById('main-board');
        const selectedPairLabel = document.getElementById('selected-pair-label');
        const signalText = document.getElementById('signal-text');
        const priceVal = document.getElementById('price-val');
        const indicatorVal = document.getElementById('indicator-val');
        const strengthVal = document.getElementById('strength-val');
        const countdownTimer = document.getElementById('countdown-timer');

        let currentTimeLeft = 5;
        let selectedTimeframe = 5;

        timeframeSelect.addEventListener('change', (e) => {
            selectedTimeframe = parseInt(e.target.value);
            currentTimeLeft = selectedTimeframe;
        });

        function runScannerEngine() {
            selectedPairLabel.textContent = pairSelect.value;
            
            // Generate simulated analytical state
            const randomVal = Math.random();
            const price = (1.0 + Math.random() * 0.1).toFixed(5);
            priceVal.textContent = price;

            let signal = "WAIT";
            let modeClass = "wait-mode";
            let indicatorState = "Neutral Range";
            let strengthState = "Insufficient Momentum";

            // Conditional simulation logic for demo strength signals
            if (randomVal < 0.33) {
                signal = "BUY";
                modeClass = "buy-mode";
                indicatorState = "Oversold Bounce";
                strengthState = "Strong Bullish Setup";
            } else if (randomVal > 0.66) {
                signal = "SELL";
                modeClass = "sell-mode";
                indicatorState = "Overbought Rejection";
                strengthState = "Strong Bearish Setup";
            }

            // Apply theme classes
            mainBoard.className = `board ${modeClass}`;
            signalText.textContent = signal;
            indicatorVal.textContent = indicatorState;
            strengthVal.textContent = strengthState;
        }

        // Timer Loop running every second
        setInterval(() => {
            currentTimeLeft--;
            if (currentTimeLeft <= 0) {
                currentTimeLeft = selectedTimeframe;
                runScannerEngine(); // Refresh signal data on cycle reset
            }
            countdownTimer.textContent = `Next Window: ${currentTimeLeft}s`;
        }, 1000);

        // Initial run
        runScannerEngine();
    </script>
</body>
</html>
